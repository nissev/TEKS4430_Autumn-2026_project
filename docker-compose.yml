# Roadside Rover — Webots runs natively on host | ROS 2 Jazzy runs in this container
# Pattern from Autumn-2026_Assignment_4 (TCP extern controller).

services:
  ros2:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: course-ros2-rover:jazzy
    platform: linux/amd64

    volumes:
      - ./src:/ros2_ws/src
      - ros2_rover_build:/ros2_ws/build
      - ros2_rover_install:/ros2_ws/install
      - ros2_rover_log:/ros2_ws/log

    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - USER=root                       # avoids 'default' user breaking the handshake
      - WEBOTS_HOME=/opt/webots         # suppress "install Webots?" prompt
      - WEBOTS_SHARED_FOLDER=/tmp       # forces controller_protocol() == "tcp"
      - WEBOTS_HOST=${WEBOTS_HOST:-host.docker.internal}
      # Robot name must match the `name` field in src/worlds/roadside_arena.wbt
      - WEBOTS_CONTROLLER_URL=tcp://${WEBOTS_HOST:-host.docker.internal}:1234/${ROBOT_NAME:-pioneer_rover}

    network_mode: ${NETWORK_MODE:-bridge}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    stdin_open: true
    tty: true

volumes:
  ros2_rover_build:
  ros2_rover_install:
  ros2_rover_log:
